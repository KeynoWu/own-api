# tag v* 推送即出桌面安装包：mac(aarch64 + Intel) .dmg + Windows .exe → GitHub Releases
# Intel 包在 Apple Silicon runner 上交叉产出：SEA 无需运行 x64（node x64 经 Rosetta 执行），
# Rust 用 --target x86_64-apple-darwin 交叉；产物统一 adhoc 签名（signingIdentity "-"）
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: mac-aarch64
            bundle_subdir: ''
          - os: macos-latest
            label: mac-x86_64
            node_arch: x64                 # setup-node 取 x64 构建（arm runner 走 Rosetta）
            rust_target: x86_64-apple-darwin
            bundle_subdir: x86_64-apple-darwin/
          - os: windows-latest
            label: win-x64
            bundle_subdir: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ !matrix.node_arch }}
        with: { node-version: 22 }
      - uses: actions/setup-node@v4
        if: ${{ matrix.node_arch }}
        with: { node-version: 22, architecture: '${{ matrix.node_arch }}' }
      - uses: dtolnay/rust-toolchain@stable
      - name: rustup 交叉目标
        if: ${{ matrix.rust_target }}
        run: rustup target add ${{ matrix.rust_target }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: 前端内嵌 + SEA 二进制 + sidecar 就位
        run: |
          npm ci
          npm run gen:web
          npm run desktop:prepare
      - name: tauri build
        run: npx tauri build ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}
      - name: 包内侧车冒烟（v0.1.1 hardened-runtime SIGTRAP 事故的制度化守护）
        if: ${{ runner.os == 'macOS' }}
        run: |
          # 验的就是用户真正拿到手的 dmg（bundle_dmg.sh 打包后 bundle/macos 下的 .app 会被搬走）
          DMG=$(ls src-tauri/target/${{ matrix.bundle_subdir }}release/bundle/dmg/*.dmg)
          hdiutil attach "$DMG" -nobrowse -mountpoint /tmp/oa-smoke >/dev/null
          OWN_API_DATA_DIR="$RUNNER_TEMP/sidecar-smoke" OWN_API_PORT=18990 /tmp/oa-smoke/own-api.app/Contents/MacOS/own-api >/tmp/smoke-sidecar.log 2>&1 &
          SIDECAR=$!
          trap 'kill $SIDECAR 2>/dev/null; hdiutil detach /tmp/oa-smoke -force >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            sleep 1
            CODE=$(curl -s -o /dev/null --connect-timeout 1 -w "%{http_code}" http://127.0.0.1:18990/v1/models || true)
            if [ "$CODE" = "401" ]; then echo "dmg 内侧车冒烟 OK（401 as expected）"; kill $SIDECAR; exit 0; fi
          done
          echo "::error::dmg 内侧车 30 秒未就绪（签名/SEA 注入回归？）"; cat /tmp/smoke-sidecar.log; exit 1
      - name: 产物存在性硬校验（防空 glob 静默发布）
        run: ls src-tauri/target/${{ matrix.bundle_subdir }}release/bundle/dmg/*.dmg src-tauri/target/${{ matrix.bundle_subdir }}release/bundle/nsis/*.exe || true
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          if-no-files-found: warn
          path: |
            src-tauri/target/${{ matrix.bundle_subdir }}release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.bundle_subdir }}release/bundle/nsis/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: 'true' }
      - name: 资产数量硬校验（三平台缺一不可）
        run: test "$(find artifacts -name '*.dmg' -o -name '*.exe' | wc -l)" -ge 3
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
          generate_release_notes: true
          draft: false
      # ↓↓↓ 公开发版：同事免登录下载，源码仍私有。需 secret RELEASES_TOKEN（对 own-api-releases 有写权限）
      - uses: actions/checkout@v4
      - name: 从 CHANGELOG.md 提取当前版本更新说明
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          awk -v head="## ${GITHUB_REF_NAME}" '
            index($0, head) == 1 {
              rest = substr($0, length(head) + 1)
              if (rest == "" || rest ~ /^ / || rest ~ /^（/) { flag = 1; next }
            }
            /^## / && flag { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "::error::CHANGELOG.md 缺 ${GITHUB_REF_NAME} 段落"; exit 1; }
      - name: 同步安装包+说明到公开下载仓库（KeynoWu/own-api-releases）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: KeynoWu/own-api-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
          body_path: release-notes.md
          fail_on_unmatched_files: true
          draft: false
