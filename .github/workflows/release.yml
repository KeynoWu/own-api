# tag v* 推送即出桌面安装包：mac(aarch64 + Intel) .dmg + Windows .exe → GitHub Releases
# Intel 包在 Apple Silicon runner 上交叉产出：SEA 无需运行 x64（node x64 经 Rosetta 执行），
# Rust 用 --target x86_64-apple-darwin 交叉；产物统一 adhoc 签名（signingIdentity "-"）
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: mac-aarch64
            bundle_subdir: ''
          - os: macos-latest
            label: mac-x86_64
            node_arch: x64                 # setup-node 取 x64 构建（arm runner 走 Rosetta）
            rust_target: x86_64-apple-darwin
            bundle_subdir: x86_64-apple-darwin/
          - os: windows-latest
            label: win-x64
            bundle_subdir: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 版本一致性（tag ↔ package.json）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VER="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$VER" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $VER 不一致——发出去的包会挂着错的版本号"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ !matrix.node_arch }}
        with: { node-version: 22 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ matrix.node_arch }}
        with: { node-version: 22, architecture: '${{ matrix.node_arch }}' }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable(2026-09)
      - name: rustup 交叉目标
        if: ${{ matrix.rust_target }}
        run: rustup target add ${{ matrix.rust_target }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: src-tauri }
      - name: 质量门禁（H1：不发红着的安装包）
        run: |
          npm ci
          npm run gen:web
          npm run typecheck
          npm run test:all
      - name: SEA 二进制 + sidecar 就位
        run: npm run desktop:prepare
      - name: tauri build
        run: npx tauri build ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}
      - name: 包内侧车冒烟（v0.1.1 hardened-runtime SIGTRAP 事故的制度化守护）
        if: ${{ runner.os == 'macOS' }}
        run: |
          # 验的就是用户真正拿到手的 dmg（bundle_dmg.sh 打包后 bundle/macos 下的 .app 会被搬走）
          DMG=$(ls src-tauri/target/${{ matrix.bundle_subdir }}release/bundle/dmg/*.dmg)
          hdiutil attach "$DMG" -nobrowse -mountpoint /tmp/oa-smoke >/dev/null
          OWN_API_DATA_DIR="$RUNNER_TEMP/sidecar-smoke" OWN_API_PORT=18990 /tmp/oa-smoke/own-api.app/Contents/MacOS/own-api >/tmp/smoke-sidecar.log 2>&1 &
          SIDECAR=$!
          trap 'kill $SIDECAR 2>/dev/null; hdiutil detach /tmp/oa-smoke -force >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            sleep 1
            CODE=$(curl -s -o /dev/null --connect-timeout 1 -w "%{http_code}" http://127.0.0.1:18990/v1/models || true)
            if [ "$CODE" = "401" ]; then echo "dmg 内侧车冒烟 OK（401 as expected）"; kill $SIDECAR; exit 0; fi
          done
          echo "::error::dmg 内侧车 30 秒未就绪（签名/SEA 注入回归？）"; cat /tmp/smoke-sidecar.log; exit 1
      - name: 产物存在性硬校验（防空 glob 静默发布）
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ls src-tauri/target/release/bundle/nsis/*.exe
          else
            ls src-tauri/target/${{ matrix.bundle_subdir }}release/bundle/dmg/*.dmg
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.bundle_subdir }}release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.bundle_subdir }}release/bundle/nsis/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - name: 触发防呆（workflow_dispatch 无 tag，发布会造出不存在的版本引用）
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "::error::release 只允许 v* tag 推送触发；dispatch 仅可用于验证 build" && exit 1
      # checkout 必须先于 download-artifact：checkout 的 git clean 会清掉未跟踪的 artifacts/
      # （v0.1.11 第三次事故同根因——softprops 排在 checkout 后，glob 永远零匹配）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 发布说明＝CHANGELOG 对应版本节（v0.1.6 曾只挂出裸对比链接）
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v tag="## v${VER}（" 'index($0,tag)==1{f=1;next} f&&/^## /{exit} f' CHANGELOG.md > release-body.md
          [ -s release-body.md ] || { echo "::warning::CHANGELOG 找不到 v${VER} 节，release 说明退化为对比链接"; }
          printf '\n完整更新史：%s/blob/%s/CHANGELOG.md\n' "$GITHUB_SERVER_URL" "$GITHUB_REF_NAME" >> release-body.md
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: artifacts, merge-multiple: 'true' }
      # v0.1.10 事故修复：upload-artifact v4 按匹配目录保留 dmg//nsis/ 子层，merge 后产物在
      # artifacts/dmg、artifacts/nsis 下——根层平铺 glob 与别名步骤全部零匹配，且别名步骤的
      # case 恰好吞掉 cp 报错造成静默假象。平铺 + 硬校验一步到位。
      - name: 产物平铺归一
        run: |
          set -e
          shopt -s nullglob
          for f in artifacts/dmg/*.dmg artifacts/nsis/*.exe; do mv "$f" artifacts/; done
          N=$(find artifacts -maxdepth 1 \( -name '*.dmg' -o -name '*.exe' \) | wc -l)
          echo "平铺后安装包数: $N"
          [ "$N" -ge 3 ] || { echo "::error::平铺后安装包少于 3——artifact 下载/结构不符合预期"; exit 1; }
          find artifacts -maxdepth 1 -type f | sort
      - name: 资产数量硬校验（三平台缺一不可）
        run: test "$(find artifacts -name '*.dmg' -o -name '*.exe' | wc -l)" -ge 3
      - name: 校验和（必须在 checkout 之前——checkout 会清掉未跟踪的 artifacts/，v0.1.7/v0.1.8 两次事故同根因）
        shell: bash
        run: cd artifacts && find . \( -name '*.dmg' -o -name '*.exe' \) -type f | sort | xargs sha256sum > sha256sums.txt
      - name: 版本无关别名（落地页直链 releases/latest/download/<别名> 永指最新版，不随版本号过期）
        shell: bash
        working-directory: artifacts
        run: |
          set -e
          shopt -s nullglob
          for f in *.dmg *.exe; do
            case "$f" in
              *aarch64.dmg)  cp "$f" own-api-macos-arm64.dmg ;;
              *x64.dmg)      cp "$f" own-api-macos-x64.dmg ;;
              *x64-setup.exe) cp "$f" own-api-windows-x64-setup.exe ;;
            esac
          done
          ls -la
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # 平铺 glob（`**` 不匹配根层文件）；前提由「产物平铺归一」步骤保证——v0.1.9/v0.1.10 两次
          # 零匹配事故同根因：merge 下载后产物在 dmg//nsis/ 子层，未平铺
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/sha256sums.txt
          body_path: release-body.md
          draft: false
          fail_on_unmatched_files: true # v0.1.7 事故：glob 零匹配时静默发空 release，success 假象
      - name: 发布后资产硬校验（软校验不可靠，传完必须见真资产）
        shell: bash
        run: |
          # v0.1.14 事故：上传步骤已逐个 ✅ 且 softprops 已报 "Release ready"，紧随其后的单次
          # API 查询却只看到 1 个资产——/releases/tags 视图有最终一致性延迟，查早了就是假红
          # （release 本体 7/7 齐全，run 却被标 failure）。改为退避轮询：资产数只增不减，
          # 读到 ≥7 即为真；轮询耗尽仍不足才是上传环节真失败。
          ok=""
          for i in 1 2 3 4 5 6 7 8; do
            N=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '[.assets] | length')
            echo "第 $i 次查询 release 资产数: $N"
            [ "$N" -ge 7 ] && { ok=1; break; }
            sleep 5
          done
          [ -n "$ok" ] || { echo "::error::轮询 8 次后 release 资产仍少于 7（3 平台包 + 3 别名直链 + sha256sums）——上传环节真失败"; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
